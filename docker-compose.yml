# Local dev infrastructure: the two stores the agent reads from (contract §1).
# Both use named volumes, so ingested data survives `docker compose down`.
# Use `docker compose down -v` to wipe and re-ingest from scratch.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: cinerag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + web dashboard at http://localhost:6333/dashboard
      - "6334:6334"   # gRPC (the Python client prefers this for bulk upserts)
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Qdrant's image is distroless — no curl/wget — so probe with its own binary.
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    container_name: cinerag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP + Neo4j Browser — open this to *see* the graph
      - "7687:7687"   # Bolt — what neo4j_client.py connects over
    environment:
      # Compose substitutes these from .env. Neo4j wants them as one USER/PASSWORD pair.
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cinerag_dev_password}
      # Modest heap/page-cache for a ~5k movie graph on a laptop.
      # Neo4j env-var escaping: `_` becomes `.`, `__` becomes `_`. So
      # `server.memory.heap.initial_size` -> NEO4J_server_memory_heap_initial__size
      # and `server.memory.pagecache.size` -> NEO4J_server_memory_pagecache_size.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
