[project]
name = "cinerag"
version = "0.1.0"
description = "Intent-driven movie recommendation agent over Qdrant + Neo4j, grounded on TMDB data"
readme = "README.md"
requires-python = ">=3.11"

# Dependencies are added per-day as the build needs them, rather than all up front.
dependencies = [
    # Day 1: config, logging, and the TMDB pull.
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "tqdm>=4.66",
    # Day 2: populate both stores.
    "openai>=1.54",
    "qdrant-client>=1.12",
    "neo4j>=5.26",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
